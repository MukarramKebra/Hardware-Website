<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex" />
  <title>Page Not Found | Expert Hardware Kuwait</title>
  <!--
    GitHub Pages serves this file automatically for any unmatched path on
    this project (must live at the repo root, filename exactly 404.html —
    see https://docs.github.com/pages/getting-started-with-github-pages/creating-a-custom-404-page-for-your-github-pages-site).
    Deliberately self-contained (no dependency on the dynamic code/css or
    code/js loaders in index.html) — an error page shouldn't have its own
    chance to fail to load.
  -->
  <style>
    :root { --red: #d20d17; --dark: #1a1a1a; --gray: #6b7280; --light: #f6f7f9; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--light); color: var(--dark);
    }
    header {
      background: var(--red); padding: 16px 24px;
    }
    header a {
      display: inline-flex; align-items: center; gap: 10px;
      text-decoration: none; color: #fff; font-weight: 800; font-size: 18px;
    }
    header img { height: 34px; width: auto; }
    header .logo-fallback { display: none; letter-spacing: 1px; }
    main {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 48px 20px;
    }
    .code {
      font-size: clamp(72px, 18vw, 140px); font-weight: 900; color: var(--red);
      line-height: 1; margin: 0;
    }
    h1 { font-size: clamp(20px, 4vw, 28px); margin: 12px 0 8px; }
    p { color: var(--gray); font-size: 15px; max-width: 440px; margin: 0 0 28px; line-height: 1.6; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 26px; border-radius: 8px; font-weight: 700; font-size: 14px;
      text-decoration: none; transition: opacity .15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-secondary { background: #fff; color: var(--dark); border: 1.5px solid #e2e4e8; }
    footer { padding: 20px; text-align: center; color: var(--gray); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <a href="/Hardware-Website/">
      <img src="/Hardware-Website/logo.png" alt="Expert Hardware" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'" />
      <span class="logo-fallback">EXPERT HARDWARE</span>
    </a>
  </header>
  <main>
    <p class="code">404</p>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Check the link, or head back to browse our full catalog of tools and hardware.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/Hardware-Website/">
        Back to Homepage
      </a>
      <a class="btn btn-secondary" href="/Hardware-Website/#categories">
        Browse Categories
      </a>
    </div>
  </main>
  <footer>Expert Hardware &mdash; Kuwait City, For Wholesale &amp; Retail Trade</footer>
</body>
</html>
