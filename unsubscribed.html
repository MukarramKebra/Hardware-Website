<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Unsubscribed | Expert Hardware Kuwait</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <style>
    :root { --orange:#c8151b; }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7f9;color:#1f2937}
    .card{max-width:520px;margin:60px auto;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:32px;text-align:center}
    .brand{color:var(--orange);font-weight:800;font-size:20px;letter-spacing:.5px;margin-bottom:14px}
    h1{font-size:22px;margin:0 0 10px}
    p{font-size:15px;line-height:1.7;color:#374151;margin:0 0 22px}
    a.back{display:inline-block;background:var(--orange);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:10px}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">EXPERT HARDWARE</div>
    <h1 id="title">Working on it…</h1>
    <p id="msg">One moment.</p>
    <a class="back" href="./">Back to store</a>
  </div>
  <script>
  var status = new URLSearchParams(window.location.search).get('status');
  var titleEl = document.getElementById('title');
  var msgEl = document.getElementById('msg');
  if (status === 'ok') {
    titleEl.textContent = "You're unsubscribed";
    msgEl.textContent = "You will no longer receive marketing emails from Expert Hardware. Sorry to see you go — you can subscribe again anytime from our website.";
  } else if (status === 'notfound') {
    titleEl.textContent = 'Link not recognised';
    msgEl.textContent = "We couldn't find a matching subscription. You may already be unsubscribed. Questions? Email muk@expertshardware.com.";
  } else {
    titleEl.textContent = 'Invalid link';
    msgEl.textContent = 'This unsubscribe link is missing or invalid. If you keep receiving emails, contact muk@expertshardware.com.';
  }
  </script>
</body>
</html>
